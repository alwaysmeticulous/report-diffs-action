name: "Meticulous - Upload Assets"
description: "Upload assets to Meticulous for testing."
inputs:
  api-token:
    description: "Meticulous API token."
    required: true
  github-token:
    description: "GITHUB_TOKEN or a repo scoped PAT."
    required: true
    default: ${{ github.token }}
  app-directory:
    description: |
      The directory containing the built assets to upload to Meticulous for testing.
    required: true
  rewrites:
    description: |
      A JSON array of rewrites to apply to the assets. Each of these should be an object with a "source" and "destination" property.
      For more details on the syntax see https://github.com/vercel/serve-handler?tab=readme-ov-file#rewrites-array.
    required: false
    default: "[]"
  base-api-url:
    description: Override the Meticulous base API URL. Only needed for self-hosted or staging environments.
    required: false
  commit-sha:
    description: |
      The commit SHA to associate the uploaded assets with. If not provided, the action will try to read it
      from the checked-out git repository, falling back to the GITHUB_SHA environment variable. Provide this
      explicitly when running without 'actions/checkout' (e.g. in a job that only downloads a pre-built artifact).
    required: false
  base-workflow-run-id:
    description: |
      GitHub workflow run ID of a base build already dispatched by an ensure-base
      step in another job. Not needed when ensure-base ran in this job, where the
      run is picked up from the environment automatically.
      Pass base-commit-sha alongside it. Without that, the run is waited on
      unchecked and a warning is emitted, because there is no way to tell whether
      it is building the base this step resolved.
    required: false
  base-commit-sha:
    description: |
      The base commit the run in base-workflow-run-id is building, as reported by
      that ensure-base step's base-commit-sha output. This step resolves the base
      for itself and waits on that run only when the two agree; otherwise it
      dispatches its own base build.
    required: false

outputs:
  base-workflow-run-id:
    description: |
      GitHub workflow run ID of the base build this step waited on or dispatched,
      if any.
  base-commit-sha:
    description: |
      The base commit that base-workflow-run-id is building, if any.
runs:
  using: node24
  main: "../out/upload-assets.entrypoint.js"
  post: "../out/upload-assets.post-step.entrypoint.js"
branding:
  color: purple
  icon: camera
