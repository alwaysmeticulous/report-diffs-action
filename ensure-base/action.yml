name: "Meticulous - Ensure Base"
description: "Dispatch a base-commit build at workflow start so it runs in parallel with the PR build. Must live in the same workflow file as upload-assets or upload-container."
inputs:
  api-token:
    description: "Meticulous API token."
    required: true
  github-token:
    description: "GITHUB_TOKEN or a repo scoped PAT."
    required: true
    default: ${{ github.token }}

outputs:
  base-workflow-run-id:
    description: |
      GitHub workflow run ID of the base build this step dispatched or found
      already pending. Later upload-assets / upload-container steps in the same
      job pick this up automatically via METICULOUS_BASE_WORKFLOW_RUN_ID, paired
      with the base commit it is building in METICULOUS_BASE_WORKFLOW_COMMIT_SHA;
      pass it explicitly only when the upload step is in a different job, and
      pass base-commit-sha with it.
  base-commit-sha:
    description: |
      The base commit this step resolved, which is the commit the run in
      base-workflow-run-id is building. Pass both to an upload step in another
      job: the upload step resolves the base for itself and only waits on that
      run when the two agree.
runs:
  using: node24
  main: "../out/ensure-base.entrypoint.js"
branding:
  color: purple
  icon: camera
